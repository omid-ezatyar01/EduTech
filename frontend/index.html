    <script>
      (function setBootLoaderLanguage() {
        try {
          var savedLanguage = window.localStorage.getItem("edutech-language");
          var isPersian =
            savedLanguage === "fa" ||
            (!savedLanguage &&
              document.documentElement.lang &&
              document.documentElement.lang.toLowerCase().startsWith("fa"));
          var label = document.getElementById("app-boot-loader-label");
          if (!label) return;
          label.textContent = isPersian ? "در حال بارگذاری" : "Loading";
        } catch (_error) {}
      })();
    </script>
